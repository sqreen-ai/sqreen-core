name: Release mcp-proxy (sqreen-core)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mcp-proxy-darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mcp-proxy-darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mcp-proxy-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: mcp-proxy-linux-aarch64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary (open-core features only)
        working-directory: mcp-proxy
        run: cargo build --release --locked --no-default-features --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp "mcp-proxy/target/${{ matrix.target }}/release/mcp-proxy" dist/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist mcp-proxy
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" | tee "${{ matrix.artifact }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  sign-and-publish:
    name: Sign manifest and publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (github.repository == 'sqreen-ai/sqreen-core' || github.repository == 'sqreen-ai/sqreen')
    permissions:
      contents: write
    env:
      SQREEN_RELEASE_SIGNING_KEY_B64: ${{ secrets.SQREEN_RELEASE_SIGNING_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Require all platform artifacts
        run: |
          set -euo pipefail
          for name in \
            mcp-proxy-darwin-aarch64.tar.gz \
            mcp-proxy-darwin-x86_64.tar.gz \
            mcp-proxy-linux-aarch64.tar.gz \
            mcp-proxy-linux-x86_64.tar.gz
          do
            test -f "artifacts/${name}" || { echo "missing ${name}"; exit 1; }
          done
          ls -lh artifacts/

      - name: Install OpenSSL 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssl
          openssl version

      - name: Sign release manifest
        run: |
          set -euo pipefail
          if [[ -z "${SQREEN_RELEASE_SIGNING_KEY_B64:-}" ]]; then
            echo "SQREEN_RELEASE_SIGNING_KEY_B64 secret is required to publish a trusted release" >&2
            exit 1
          fi
          umask 077
          KEY_FILE="$(mktemp)"
          printf '%s' "$SQREEN_RELEASE_SIGNING_KEY_B64" | base64 -d >"$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export SQREEN_RELEASE_SIGNING_KEY="$KEY_FILE"
          mkdir -p signed
          bash mcp-proxy/scripts/sign-release-manifest.sh \
            "${GITHUB_REF_NAME}" \
            artifacts \
            signed
          cp artifacts/*.tar.gz signed/
          printf '{"version":"%s","integrity":"see release-manifest.json"}\n' "${GITHUB_REF_NAME}" \
            > signed/manifest.json
          shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/*.tar.gz
            signed/release-manifest.json
            signed/release-manifest.json.sig
          generate_release_notes: true

      - name: Stage release assets for enterprise mirror (optional artifact)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p "dist/releases/${VERSION}" "dist/releases/latest"
          cp signed/*.tar.gz "dist/releases/${VERSION}/"
          cp signed/release-manifest.json signed/release-manifest.json.sig \
            "dist/releases/${VERSION}/"
          cp signed/*.tar.gz "dist/releases/latest/"
          cp signed/release-manifest.json signed/release-manifest.json.sig \
            "dist/releases/latest/"
          cp signed/manifest.json dist/releases/manifest.json
          cp mcp-proxy/keys/sqreen-release-ed25519.pub \
            dist/releases/sqreen-release-ed25519.pub
          cp mcp-proxy/install.sh dist/install.sh
          ls -lh "dist/releases/${VERSION}/"

      - uses: actions/upload-artifact@v5
        with:
          name: release-site-mirror
          path: dist/
