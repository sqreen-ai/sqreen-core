name: Test Sqreen Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: mcp-proxy (unit + local e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Unit tests (open-core features)
        working-directory: mcp-proxy
        run: cargo test --locked --no-default-features

      - name: Build release binary (open-core features)
        working-directory: mcp-proxy
        run: cargo build --release --locked --no-default-features

      - name: E2E policy enforcement
        env:
          MCP_PROXY_BIN: ${{ github.workspace }}/mcp-proxy/target/release/mcp-proxy
          MCP_POLICY_PATH: ${{ github.workspace }}/mcp-proxy/mcp-policy.yaml
        run: bash mcp-proxy/scripts/e2e-policy-test.sh

      - name: E2E threat-intel IOC match
        env:
          MCP_PROXY_BIN: ${{ github.workspace }}/mcp-proxy/target/release/mcp-proxy
          MCP_POLICY_PATH: ${{ github.workspace }}/mcp-proxy/mcp-policy.yaml
        run: bash mcp-proxy/scripts/e2e-threat-intel-test.sh

      - name: E2E HTTP agent firewall
        env:
          MCP_PROXY_BIN: ${{ github.workspace }}/mcp-proxy/target/release/mcp-proxy
          MCP_POLICY_PATH: ${{ github.workspace }}/mcp-proxy/mcp-policy.yaml
        run: bash mcp-proxy/scripts/e2e-http-agent-firewall.sh

      - name: Supply-chain integrity tests
        run: bash mcp-proxy/tests/supply_chain/run.sh

      - name: Local demo smoke
        working-directory: mcp-proxy
        env:
          MCP_POLICY_PATH: ${{ github.workspace }}/mcp-proxy/mcp-policy.yaml
        run: ./target/release/mcp-proxy demo

      - name: Installer sync guard (skips when frontend absent)
        run: bash mcp-proxy/scripts/check-installer-sync.sh

      - name: Security baseline sync guard (skips enterprise mirrors when absent)
        run: bash mcp-proxy/scripts/check-security-baseline-sync.sh

  hooks:
    name: Project hooks smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hook smoke tests
        run: bash mcp-proxy/scripts/test-cursor-hook.sh
